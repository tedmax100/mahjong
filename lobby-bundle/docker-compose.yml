version: '3.8'

services:
  mahjong-lobby:
    build:
      context: ..
      dockerfile: lobby-bundle/Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - GIN_MODE=release
      - AUTH_PROXY_URL=${AUTH_PROXY_URL}
      - GAME_SERVER_URL=${GAME_SERVER_URL}
      - GAME_CLIENT_URL=${GAME_CLIENT_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - LOBBY_INTERNAL_SECRET=${LOBBY_INTERNAL_SECRET}
      - EXTERNAL_SERVER_SECRET=${EXTERNAL_SERVER_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
