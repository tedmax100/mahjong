    #   with:
    #     auth: ${{ secrets.GIST_SECRET }}
    #     gistID: ${{ secrets.GIST_ID }}
    #     filename: go-coverage.json
    #     label: Go Coverage
    #     message: ${{ env.GO_COVERAGE }}%
    #     color: green

  # Frontend (Node.js) Test & Coverage
  # 請確保您的前端程式碼有 package.json 並且定義了測試腳本
  frontend-test:
    runs-on: ubuntu-latest
    # 如果前端在子目錄，請取消註解並修改以下路徑
    # defaults:
    #   run:
    #     working-directory: ./client 
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # cache: 'npm' # 如果有 package-lock.json 可以開啟

    # 檢查是否有 package.json，如果沒有則跳過
    - name: Check for package.json
      id: check_package
      run: |
        if [ -f "package.json" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "No package.json found, skipping frontend tests."
        fi

    - name: Install Dependencies
      if: steps.check_package.outputs.exists == 'true'
      run: npm install

    - name: Run Tests with Coverage
      if: steps.check_package.outputs.exists == 'true'
      # 假設您的測試指令是 npm run test:coverage
      # 並且使用 Jest/Vitest 產生 coverage-summary.json
